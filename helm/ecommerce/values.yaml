postgres:
  enabled: true
  replicaCount: 1
  strategy: Recreate

  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent

  auth:
    database: ecommerce
    username: ecommerce
    existingSecret: postgres-credentials
    passwordKey: password

  service:
    name: postgres-service
    type: ClusterIP
    port: 5432

  persistence:
    enabled: true
    claimName: postgres-pvc
    accessMode: ReadWriteOnce
    size: 5Gi
    mountPath: /var/lib/postgresql/data

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  probes:
    startup:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 30

    readiness:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3

    liveness:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3

redis:
  enabled: true
  replicaCount: 1

  resources:
    requests:
      cpu: "10m"
      memory: "32Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"

  probes:
    startup:
      enabled: true
      initialDelaySeconds: 1
      periodSeconds: 2
      timeoutSeconds: 1
      failureThreshold: 30

    readiness:
      enabled: true
      initialDelaySeconds: 1
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 3

    liveness:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 20
      timeoutSeconds: 2
      failureThreshold: 3

  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent

  service:
    name: redis-service
    type: ClusterIP
    port: 6379

api:
  enabled: true
  replicaCount: 1

  image:
    repository: ecommerce-api
    tag: "v7"
    pullPolicy: IfNotPresent

  containerPort: 8000

  auth:
    # "local" or "production". Setting this to production makes the API refuse
    # to start without a real JWT secret and an explicit CORS origin list, and
    # makes `helm template` fail early if either is missing here.
    appEnv: local

    # The session cookie can only carry the Secure flag over HTTPS, so this
    # stays false until the production Gateway terminates TLS.
    cookieSecure: false

    # Origins allowed to call the API with credentials. Empty falls back to the
    # local development hosts built into the application.
    corsAllowedOrigins: []

    # Secret holding the JWT signing key. Required when appEnv is production.
    existingSecret: ""
    jwtSecretKey: jwt-secret

  serviceMonitor:
    enabled: true
    prometheusRelease: monitoring
    interval: 30s
    scrapeTimeout: 10s

  prometheusRule:
    enabled: true
    prometheusRelease: monitoring

    apiDown:
      for: 2m

    highErrorRate:
      window: 5m
      minimumRequests: 20
      thresholdPercent: 5
      for: 5m

    highLatency:
      window: 5m
      minimumRequests: 20
      thresholdSeconds: 1
      for: 5m

  probes:
    liveness:
      enabled: true
      path: /live
      initialDelaySeconds: 10
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3

    readiness:
      enabled: true
      path: /ready
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3

  service:
    name: ecommerce-api-service
    type: NodePort
    port: 8000
    targetPort: 8000

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 50

  route:
    enabled: true
    name: ecommerce-api-route
    hostname: api.ecommerce.local
    path: /

gateway:
  name: ecommerce-gateway
  namespace: gateway-system

frontend:
  enabled: true
  replicaCount: 1

  resources:
    requests:
      cpu: "10m"
      memory: "32Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"

  image:
    repository: ecommerce-frontend
    tag: "v1"
    pullPolicy: IfNotPresent

  containerPort: 80

  probes:
    liveness:
      enabled: true
      path: /
      initialDelaySeconds: 5
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3

    readiness:
      enabled: true
      path: /
      initialDelaySeconds: 2
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3


  service:
    name: ecommerce-frontend-service
    type: ClusterIP
    port: 80
    targetPort: 80

  route:
    enabled: true
    name: ecommerce-frontend-route
    hostname: ecommerce.local
    path: /