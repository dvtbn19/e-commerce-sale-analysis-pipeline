version: 2

models:
  - name: stg_amazon_sales
    description: Cleaned and standardized Amazon sales data.

    columns:

      - name: source_row_id
        description: Original row identifier from the source CSV.
        data_tests:
          - not_null
          - unique

      - name: order_id
        description: Amazon order identifier.
        data_tests:
          - not_null

      - name: category
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Set
                  - Kurta
                  - Western Dress
                  - Top
                  - Ethnic Dress
                  - Blouse
                  - Bottom
                  - Saree
                  - Dupatta