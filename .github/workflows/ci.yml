name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    name: API + ingestion tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/api/requirements-dev.txt
            services/ingestion/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r services/api/requirements-dev.txt
          pip install -r services/ingestion/requirements.txt

      - name: Run pytest
        run: python -m pytest -v

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  helm:
    name: Helm lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint helm/ecommerce

      - name: Render templates
        run: helm template ecommerce helm/ecommerce > /dev/null

  dbt-tests:
    name: dbt tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ecommerce
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ci_test_password
      SOURCE_CSV_PATH: services/ingestion/tests/fixtures/amazon_sales_sample.csv

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r services/ingestion/requirements.txt
          pip install dbt-core==1.12.2 dbt-postgres==1.11.0

      - name: Load sample data
        run: python -m services.ingestion.load_csv

      - name: dbt run
        run: dbt run --project-dir dbt/ecommerce --profiles-dir dbt/ecommerce

      - name: dbt test
        run: dbt test --project-dir dbt/ecommerce --profiles-dir dbt/ecommerce

  build-api-image:
    name: Build + push API image
    runs-on: ubuntu-latest
    needs: [python-tests, frontend, helm, dbt-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: services/api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
            ghcr.io/${{ github.repository }}/api:latest

  build-frontend-image:
    name: Build + push frontend image
    runs-on: ubuntu-latest
    needs: [python-tests, frontend, helm, dbt-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: services/frontend
          build-args: |
            VITE_API_BASE_URL=http://api.ecommerce.local
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/frontend:latest
